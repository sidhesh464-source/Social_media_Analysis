services:
  # ====================================================
  # SentimentX Python Backend API (Flask + Gunicorn)
  # ====================================================
  - type: web
    name: sentimentx-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: HADOOP_ENABLED
        value: "false"
      - key: FIREBASE_DATABASE_URL
        value: "https://social-media-sentiment-ana-default-rtdb.asia-southeast1.firebasedatabase.app"
      - key: FIREBASE_PROJECT_ID
        value: "social-media-sentiment-ana"

  # ====================================================
  # SentimentX React / Vite Frontend (Static Site)
  # ====================================================
  - type: web
    name: sentimentx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sentimentx-api
          property: host
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyD_wprK4cwYRi9BYULfUYrd6nvUAlNPn3c"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "social-media-sentiment-ana.firebaseapp.com"
      - key: VITE_FIREBASE_DATABASE_URL
        value: "https://social-media-sentiment-ana-default-rtdb.asia-southeast1.firebasedatabase.app"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "social-media-sentiment-ana"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: "social-media-sentiment-ana.firebasestorage.app"
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "510984607074"
      - key: VITE_FIREBASE_APP_ID
        value: "1:510984607074:web:2c12b3fa66483e7111483b"
